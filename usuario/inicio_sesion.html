<!DOCTYPE html>

<html lang="es">



<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inicio de Sesión - Pastelería 1000 Sabores</title>
  <link rel="stylesheet" href="style.css">
  <!-- fuente principal -->
  <link rel="stylesheet" href="https://fonts.google.com/specimen/Lato">
  <!-- fuente encabezado -->
  <link rel="stylesheet" href="https://fonts.google.com/specimen/Pacifico">
</head>

<body class="pagina-login">
  <header class="header">
    <h1 class="titulo-logo">Pastelería 1000 Sabores</h1>
    <nav class="menu">
      <a class="menu-enlace" href="../inicio/index.html">Inicio </a>
      <a class="menu-enlace" href="../catalogo/catalogo.html">Catálogo</a>
      <a class="menu-enlace" href="inicio_sesion.html">Inicio de Sesión</a>
      <a class="menu-enlace" href="registro.html">Registro</a>
    </nav>

  </header>
  <!--Principal-->
  <main class="contenido-principal">
    <section class="seccion-login">
      <h2 class="titulo-seccion">Inicio de Sesión </h2>
      <p class="descripcion">Ingresa a tu cuenta.</p>

      <!--Formulario-->
      <form class="formulario-login">
        <div class="campo-formulario">
          <label class="etiqueta" for="correo">Correo electrónico:</label>
          <br>
          <input class="campo" type="email" id="correo" name="correo" required>
        </div>

        <div class="campo-formulario">
          <label class="etiqueta" for="contrasena">Contraseña:</label>
          <br>
          <input class="campo" type="password" id="contrasena" name="contrasena" required>
        </div>
        <button class="boton" type="submit">Iniciar Sesión</button>

      </form>
      <p class="texto-registro">
        ¿Todavia no tienes cuenta?Haz click aqui
        <a class="enlace-registro" href="registro.html">Regístrate</a>
      </p>

    </section>
  </main>

  <footer class="footer">
    <p class="texto-footer">Pastelería 1000 Sabores</p>
  </footer>

  <script src="auth.js"></script>

</body>
</html>
