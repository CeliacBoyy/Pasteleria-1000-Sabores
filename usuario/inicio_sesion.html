<body class="pagina-login">
  
<header class="nav-header">
    <nav class="nav-contenedor">

        <div class="header-logo">
            <img class="logo-img" src="..\multimedia\logo pasteleria.png" alt="logo pasteleria">

            <div>
                <h1 class="titulo-header">Pasteleria mil sabores</h1>
                <p class="eslogan-header">¡Celebra la dulzura de la vida con Pastelería 1000 Sabores!</p>
            </div>

        </div>

        <ul class="navbar-nav">
            <li class="item-nav">
                <a href="../inicio/index.html">Inicio</a>

            <li class="item-nav">

            <li class="item-nav">

  </header>
  <!--Principal-->

    <section class="seccion-login">
      <h2 class="titulo-seccion">Inicio de Sesión </h2>
      <p class="descripcion">Ingresa a tu cuenta.</p>

      <!--Formulario-->
      <form class="formulario-login">
        <div class="campo-formulario">
          <label class="etiqueta" for="correo">Correo electrónico:</label>
          <br>
          <input class="campo" type="email" id="correo" name="correo" required>
        </div>

        <div class="campo-formulario">
          <label class="etiqueta" for="contrasena">Contraseña:</label>
          <br>
          <input class="campo" type="password" id="contrasena" name="contrasena" required>
        </div>
        <button class="boton" type="submit">Iniciar Sesión</button>

      </form>
      <p class="texto-registro">
        ¿Todavia no tienes cuenta?
        <a class="enlace-registro" href="registro.html">Regístrate aqui</a>
      </p>

    </section>
  </main>

  <footer class="footer">
    <p class="texto-footer">Pastelería 1000 Sabores</p>
  </footer>

  <script src="auth.js"></script>
